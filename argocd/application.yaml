apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: poc-blue-green
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/oddsteam/poc-blue-green-istio.git  # เปลี่ยนเป็น URL ของ repository ของคุณ
    targetRevision: HEAD
    path: deployment
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
